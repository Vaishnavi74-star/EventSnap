AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EventSnap - Production Serverless Multi-Event Photo Sharing Platform

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage environment.

  MaxFileSizeBytes:
    Type: Number
    Default: 26214400 # 25 MB
    Description: Maximum allowed image size in bytes.

Globals:
  Function:
    Timeout: 15
    MemorySize: 512
    Runtime: python3.12
    Tracing: Active
    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        PHOTOS_TABLE: !Ref PhotosTable
        PHOTOS_BUCKET: !Ref PhotosBucket
        COGNITO_USER_POOL_ID: !Ref CognitoUserPool
        COGNITO_CLIENT_ID: !Ref CognitoUserPoolClient
        MAX_FILE_SIZE_BYTES: !Ref MaxFileSizeBytes
        PRESIGNED_PUT_EXPIRATION_SECONDS: "900"
        PRESIGNED_GET_EXPIRATION_SECONDS: "3600"
        CORS_ALLOWED_ORIGINS: "https://main.d2pw46kgpwxeu6.amplifyapp.com,https://d2pw46kgpwxeu6.amplifyapp.com,http://localhost:5173,*"

Resources:
  ##############################################################################
  # 1. Private S3 Bucket for Photo Storage
  ##############################################################################
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "eventsnap-photos-${Stage}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - "https://main.d2pw46kgpwxeu6.amplifyapp.com"
              - "https://d2pw46kgpwxeu6.amplifyapp.com"
              - "http://localhost:5173"
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ##############################################################################
  # 2. DynamoDB Tables (On-Demand Capacity)
  ##############################################################################
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "EventSnap_Events_${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: organizerId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: organizerId-createdAt-index
          KeySchema:
            - AttributeName: organizerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  PhotosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "EventSnap_Photos_${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: photoId
          AttributeType: S
        - AttributeName: uploadedAt
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
        - AttributeName: photoId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: EventPhotosByDate
          KeySchema:
            - AttributeName: eventId
              KeyType: HASH
            - AttributeName: uploadedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  ##############################################################################
  # 3. Amazon Cognito (Admin Authentication)
  ##############################################################################
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "eventsnap-admins-${Stage}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "eventsnap-web-client-${Stage}"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  ##############################################################################
  # 4. API Gateway HTTP API
  ##############################################################################
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins:
          - "https://main.d2pw46kgpwxeu6.amplifyapp.com"
          - "https://d2pw46kgpwxeu6.amplifyapp.com"
          - "http://localhost:5173"
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        MaxAge: 3600
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              audience:
                - !Ref CognitoUserPoolClient

  ##############################################################################
  # 5. Core Lambda Function & IAM Least-Privilege Role
  ##############################################################################
  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../src/
      Handler: router.lambda_handler
      Policies:
        # DynamoDB Permissions
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "${EventsTable.Arn}/index/*"
                - !Sub "${PhotosTable.Arn}/index/*"
        # S3 Permissions
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
                - s3:HeadObject
              Resource:
                - !Sub "${PhotosBucket.Arn}/*"
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - !GetAtt PhotosBucket.Arn
      Events:
        # Catch-all Route for HTTP API
        ProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        RootRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway Invocation URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  S3BucketName:
    Description: Private S3 Bucket for Photos
    Value: !Ref PhotosBucket

  EventsTableName:
    Description: DynamoDB Events Table
    Value: !Ref EventsTable

  PhotosTableName:
    Description: DynamoDB Photos Table
    Value: !Ref PhotosTable

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  CognitoClientId:
    Description: Cognito Web Client ID
    Value: !Ref CognitoUserPoolClient

